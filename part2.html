<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Part 2 - Effects</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <span class="logo">jQuery Garden</span>
    <a href="index.html">Home</a>
    <a href="part1.html">Part 1</a>
    <a href="part2.html" class="active">Part 2</a>
    <a href="part3.html">Part 3</a>
    <a href="part4.html">Part 4</a>
    <a href="part5.html">Part 5</a>
  </nav>
  <main>
    <h1 class="page-title">Part 2. jQuery Effects</h1>
    <section>
      <h2>Task 2. Visibility Methods</h2>
      <p id="text">You can hide and show this paragraph.</p>
      <button id="btnHide">Hide</button>
      <button id="btnShow">Show</button>
      <button id="btnToggle">Toggle</button>
    </section>
    <section>
      <h2>Task 3. Fade Methods</h2>
      <button id="btnFadeIn">Fade In</button>
      <button id="btnFadeOut">Fade Out</button>
      <button id="btnFadeToggle">Fade Toggle</button>
      <img id="fadeImg" src="images/flower.svg" alt="Flower">
    </section>
    <section>
      <h2>Task 4. Slide Methods</h2>
      <button id="btnSlideUp">Slide Up</button>
      <button id="btnSlideDown">Slide Down</button>
      <button id="btnSlideToggle">Slide Toggle</button>
      <div id="panel">This is a panel. You can open and close it.</div>
    </section>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/part2.js"></script>
</body>
</html>

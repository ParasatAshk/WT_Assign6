  <nav>

  <main>
    <section>
      <h2>Task 5. Add and Remove Elements</h2>
      <ul id="list">
        <li>Item 1</li>
        <li>Item 2</li>
      </ul>
      <button id="btnAdd">Add Item</button>
      <button id="btnAddTop">Add Item to Top</button>
      <button id="btnRemove">Remove Item</button>
    </section>
    <section>
      <h2>Task 6. Modifying Attributes</h2>
      <button id="btnImg">Change Image</button>
      <img id="myImg" src="images/photo1.svg" alt="Photo">
      <br>
      <a id="myLink" href="https://www.w3schools.com" target="_blank">Open link</a>
      <p>Link goes to: <span id="linkText">https://www.w3schools.com</span></p>
      <button id="btnLink">Change Link</button>
    </section>
    <section>
      <h2>Task 7. Form Interaction</h2>
      <form>
        <p><input type="text" id="name" placeholder="Name"></p>
        <p><input type="email" id="email" placeholder="Email"></p>
      </form>
      <p>Name: <span id="showName"></span></p>
      <p>Email: <span id="showEmail"></span></p>
    </section>
  </main>
